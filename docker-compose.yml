services:
  mysql:
    image: mysql:8.0
    container_name: gym-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: gym_tracker
      MYSQL_USER: gymapp
      MYSQL_PASSWORD: gymapppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-tracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://gymapp:gymapppassword@mysql:3306/gym_tracker
      SECRET_KEY: dev-secret-change-me
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8100:8100"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: gym-tracker-frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend:8100
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mysql_data:
