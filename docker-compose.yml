services:
  mysql:
    image: mysql:8.0
    container_name: gym-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: gym_tracker
      MYSQL_USER: gymapp
      MYSQL_PASSWORD: gymapppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
