apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - migrate-job.yaml

# Replace <PROJECT_ID> (and region, if not us-central1) after `terraform
# apply` — the real prefix is the `artifact_registry_repository_url` output.
images:
  - name: gym-tracker-backend
    newName: us-central1-docker.pkg.dev/<PROJECT_ID>/gym-tracker/gym-tracker-backend
    newTag: latest
  - name: gym-tracker-frontend
    newName: us-central1-docker.pkg.dev/<PROJECT_ID>/gym-tracker/gym-tracker-frontend
    newTag: latest
