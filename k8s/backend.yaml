apiVersion: v1
kind: ServiceAccount
metadata:
  name: gym-app-backend
  namespace: gym-tracker
  annotations:
    # Replace <PROJECT_ID> after `terraform apply` — must match the SA email
    # in the terraform/outputs.tf `backend_service_account_email` output.
    iam.gke.io/gcp-service-account: gym-tracker-backend-sa@<PROJECT_ID>.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: gym-tracker
data:
  # Only needed if something calls the backend directly, bypassing the
  # frontend's nginx proxy — same-origin requests through that proxy aren't
  # subject to CORS at all, so the default here is rarely exercised in prod.
  allowed-origins: "http://localhost:5173"
  # Replace after `terraform apply` — value of the `db_connection_name` output
  # (project:region:instance), consumed by the Cloud SQL Auth Proxy below.
  cloudsql-connection-name: "<PROJECT_ID>:<REGION>:gym-tracker-db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gym-tracker
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: gym-app-backend
      # Cloud SQL Auth Proxy as a native sidecar (KEP-753): starts before the
      # main container and is torn down automatically once it exits, so a
      # one-shot Job using this same pod spec (see migrate-job.yaml) still
      # reaches "Completed" instead of hanging on a long-running sidecar.
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          restartPolicy: Always
          args:
            - "--port=3306"
            - "$(CLOUDSQL_CONNECTION_NAME)"
          env:
            - name: CLOUDSQL_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: cloudsql-connection-name
          startupProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: backend
          image: gym-tracker-backend
          ports:
            - containerPort: 8100
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: secret-key
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: allowed-origins
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gym-tracker
spec:
  selector:
    app: backend
  ports:
    - port: 8100
      targetPort: 8100
