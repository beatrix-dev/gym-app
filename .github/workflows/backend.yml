# Backend release ("docker"): test, build the image, release it to ECS with .github/scripts/release-backend.sh.
# This release owns the task definition and the ECS service (backend/deploy/*.json); CDK owns the environment.
# Rollback: run this workflow by hand from main with the image-tag of an earlier release.
name: Backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml
      - .github/scripts/smoke-test.sh
      - .github/scripts/release-backend.sh
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
      - .github/scripts/smoke-test.sh
      - .github/scripts/release-backend.sh
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Roll back to this image tag (a commit SHA already in ECR). Leave empty to release main."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    if: inputs.image-tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - run: pytest
        working-directory: backend

  deploy:
    name: Release to ECS
    needs: test
    # Runs after the tests pass, or with no tests when rolling back to an existing image.
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # One deploy of this kind at a time. Infra never touches the ECS service (the backend release owns it), so the
    # backend and infra workflows do not need to wait for each other.
    concurrency:
      group: gym-backend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS role
    env:
      TAG: ${{ inputs.image-tag || github.sha }}
      ROLLBACK: ${{ inputs.image-tag != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Read the image repository
        id: targets
        run: |
          repository_uri=$(aws ssm get-parameter --name /gym/registry/repository-uri --query Parameter.Value --output text)
          {
            echo "repository-uri=$repository_uri"
            echo "repository-name=${repository_uri#*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether the image exists
        id: image
        env:
          REPOSITORY: ${{ steps.targets.outputs.repository-name }}
        run: |
          if error=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" 2>&1 >/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q ImageNotFoundException <<< "$error"; then
            # Throttling, AccessDenied and so on: stop with the real error, not a confusing push failure later.
            echo "$error" >&2
            exit 1
          elif [ "$ROLLBACK" = "true" ]; then
            echo "Image $TAG is not in ECR" >&2
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ECR
        if: steps.image.outputs.exists == 'false'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        if: steps.image.outputs.exists == 'false'
        run: >
          docker buildx build --platform linux/amd64
          --provenance=false --sbom=false
          -t "${{ steps.targets.outputs.repository-uri }}:$TAG"
          --push backend

      - name: Release to ECS
        run: .github/scripts/release-backend.sh "${{ steps.targets.outputs.repository-uri }}:$TAG"

      - name: Smoke test
        run: .github/scripts/smoke-test.sh
