name: Test and Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for GitHub OIDC -> AWS role assumption

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - run: pytest
        working-directory: backend

  frontend-checks:
    name: Frontend typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Typecheck + build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend

  infra-tests:
    name: Infrastructure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The CDK app bundles frontend/dist, so it must exist before synth/tests.
      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B test
        working-directory: infrastructure

  deploy:
    name: Deploy with CDK
    # Gate on all test jobs to avoid deploying anything broken.
    needs: [backend-tests, frontend-checks, infra-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # GymCi (the OIDC provider + this role) is deployed manually, never from CI.
      - name: Deploy
        run: >
          npx aws-cdk@2 deploy Gym GymCertificate
          --require-approval never
          -c allowedEmails="${{ vars.ALLOWED_EMAILS }}"
          -c googleClientId="${{ vars.GOOGLE_CLIENT_ID }}"
        working-directory: infrastructure

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://app.beatrix.co.za/api/health/db | grep -q '"db":"connected"'; then
              echo "Healthy"
              exit 0
            fi
            echo "Attempt $i failed; retrying in 5s"
            sleep 5
          done
          echo "Smoke test failed" >&2
          exit 1
